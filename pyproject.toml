[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bohrpy"
version = "0.1.0"
description = "Librería para cálculos y visualización del modelo atómico de Bohr"
readme = "README.md"
authors = [{ name = "Isabel Nieto" }, { name = "Kevin Osorio" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0"
]

[project.optional-dependencies]
test = ["pytest"]
