[build-system]
requires = ["setuptools==68.1.2"]
build-backend = "setuptools.build_meta"

[project]
name = "bohrpy"
version = "0.1.1"
description = "Librería para cálculos y visualización del modelo atómico de Bohr"
readme = "README.md"
authors = [
    { name = "Isabel Nieto" },
    { name = "Kevin Osorio" },
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
docs = ["sphinx==9.1.1", "furo==2025.12.19"]

[project.urls]
Homepage = "https://github.com/isabelnieto900/bohrpy"
Documentation = "https://isabelnieto900.github.io/bohrpy/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
